<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depot | Home</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./Style/Main.css" />
  </head>

  <body>
    <!-- Start navbar -->
    <nav class="navbar">
      <div class="container">
        <div class="navbar_menus">
          <ul>
            <li>
              <a class="home" href="#"><span>Home</span></a>
            </li>
          </ul>
          <ul>
            <li>
              <a href="#"><span>Shop</span></a>
            </li>
          </ul>
          <ul>
            <li>
              <a href="#"><span>Pages</span></a>
            </li>
          </ul>
          <ul>
            <li>
              <a href="#"><span>Elements</span></a>
            </li>
          </ul>
        </div>
        <div class="logo">
          <img src="./Assets/images/logo.png" alt="logo" />
        </div>
        <div class="navbar_tools">
          <div class="cart">
            <span>Cart <span style="opacity: 0.5">($0)</span></span>
          </div>
          <div class="login">
            <span>Login</span>
            <i class="fa-regular fa-user"></i>
          </div>
          <div class="search">
            <i class="fab fa-sistrix"></i>
          </div>
          <div class="menu"><i class="fas fa-bars"></i></div>
        </div>
      </div>
    </nav>
    <!-- End navbar -->
    <!-- start banner -->
    <main>
      <section>
        <div class="container">
          <div class="banner">
            <div class="banner_img">
              <div class="content">
                <h1>Lorem, ipsum dolor.</h1>
                <p>
                  Lorem ipsum dolor sit amet consectetur adipisicing elit.
                  Tempora fuga nostrum magni hic natus? Tempora?
                </p>
              </div>
              <div class="banner_pagination">
                <div class="banner_pagination_item" id="first">
                  <span>01</span>
                  <div class="banner_pagination_line"></div>
                </div>
                <div class="banner_pagination_item">
                  <span>02</span>
                  <div class="banner_pagination_line"></div>
                </div>
                <div class="banner_pagination_item">
                  <span>03</span>
                  <div class="banner_pagination_line"></div>
                </div>
              </div>
              <div class="banner_pagination_mobile">
                <div></div>
                <div></div>
                <div></div>
              </div>
              <div class="source">
                <img src="./Assets/images/product6.jpg" alt="image" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!-- End banner -->
  </body>
</html>
